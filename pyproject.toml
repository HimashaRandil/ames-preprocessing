[project]
name = "ames-preprocessing"
version = "0.1.0"
description = "Pre-Modeling Data Preprocessing with Ames Housing Dataset"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "ydata-profiling>=4.6.0",
    "missingno>=0.5.0",
    "scipy>=1.11.0",
    "setuptools>=68.0.0,<72",
]

[tool.uv]
dev-dependencies = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E501", "F401", "F541"]
